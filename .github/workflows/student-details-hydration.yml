name: Cadastro completo e cache por aluno

on:
  pull_request:
    paths:
      - '.github/workflows/student-details-hydration.yml'
      - 'modules/gestor/parceiros/components/viewparceiros/aluno/**'
      - 'modules/gestor/parceiros/utils/**'
      - 'modules/shared/utils/identityValidation.ts'
      - 'modules/shared/utils/technicalEnrollmentRequirements.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/student-details-hydration.yml'
      - 'modules/gestor/parceiros/components/viewparceiros/aluno/**'
      - 'modules/gestor/parceiros/utils/**'
      - 'modules/shared/utils/identityValidation.ts'
      - 'modules/shared/utils/technicalEnrollmentRequirements.ts'

permissions:
  contents: read

jobs:
  student-details-hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validar carga completa, preservação do rascunho e resposta atrasada
        run: node --test modules/gestor/parceiros/components/viewparceiros/aluno/ParceiroAlunoDetalhes.hydration.test.mjs
