name: Controle de versão

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-version-record:
    name: Validar versão e histórico
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validar registro da alteração
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-version-record.mjs --check-diff "$BASE_SHA" "$HEAD_SHA"
