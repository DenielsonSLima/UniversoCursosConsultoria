name: EAD enrollment and standalone credit corrections
on:
  pull_request:
    paths:
      - 'modules/gestor/gestao/ead/detalhes/**'
      - 'modules/gestor/financeiro/outros-creditos/**'
      - 'supabase/functions/gateways/checkout/**'
      - 'supabase/functions/asaas/api/other-credit*'
      - 'supabase/migrations/20261105*'
      - 'supabase/migrations/*block_ead_generic_enrollment_bypass.sql'
      - 'supabase/tests/ead_manager_enrollment*'
      - 'supabase/tests/ead_no_charge_enrollment*'
      - 'supabase/tests/ead_generic_enrollment_guard*'
      - 'supabase/tests/other_credit_reversal*'
      - 'supabase/tests/other_credit_untyped*'
      - 'scripts/test-ead-credit-corrections-ui.mjs'
      - '.github/workflows/ead-credit-corrections.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1
      - run: npm ci
      - name: Install isolated test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/corrections" --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.3.14 jsdom@26.1.0
          echo "PGLITE_MODULE_PATH=$RUNNER_TEMP/corrections/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
          echo "PGLITE_MODULE=$RUNNER_TEMP/corrections/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
          echo "OTHER_CREDIT_JSDOM_PATH=$RUNNER_TEMP/corrections/node_modules/jsdom/lib/api.js" >> "$GITHUB_ENV"
          echo "EAD_JSDOM_PATH=$RUNNER_TEMP/corrections/node_modules/jsdom/lib/api.js" >> "$GITHUB_ENV"
      - name: Validate corrected contracts and interactions
        run: |
          node --test supabase/tests/ead_manager_enrollment.isolated.test.mjs supabase/tests/ead_no_charge_enrollment.isolated.test.mjs supabase/tests/other_credit_untyped_cancellation.test.mjs supabase/tests/other_credit_reversal.sql.test.mjs modules/gestor/financeiro/outros-creditos/other-credit-reversal.test.ts modules/gestor/financeiro/outros-creditos/other-credit-standalone-selection.test.ts
          node supabase/tests/ead_generic_enrollment_guard.isolated.test.mjs
          node scripts/test-ead-credit-corrections-ui.mjs
          node --test --test-force-exit modules/gestor/gestao/ead/detalhes/ead-enrollment.smoke.test.mjs
          deno test --node-modules-dir=auto --no-lock --allow-read --allow-env supabase/functions/gateways/checkout/ead-manager.test.ts supabase/functions/gateways/checkout/ead-context.test.ts supabase/functions/gateways/checkout/ead-checkout-attempt.test.ts supabase/functions/asaas/api/other-credit-standalone-kind.test.ts
