name: Regressões NFS-e

on:
  pull_request:
    paths:
      - '.github/workflows/nfse-regressions.yml'
      - 'modules/gestor/emissor-nfse/**'
      - 'modules/gestor/configuracoes/nfse-portal-contribuinte/**'
      - 'modules/gestor/access-control*'
      - 'modules/gestor/gestor-navigation*'
      - 'scripts/test-nfse-local-stage1.mjs'
      - 'scripts/test-nfse-certificate-ui.mjs'
      - 'supabase/migrations/*nfse*'
      - 'supabase/tests/nfse*'
      - 'supabase/functions/_shared/nfse-national/**'
      - 'supabase/functions/nfse-certificate-upload/**'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nfse-regressions.yml'
      - 'modules/gestor/emissor-nfse/**'
      - 'modules/gestor/configuracoes/nfse-portal-contribuinte/**'
      - 'modules/gestor/access-control*'
      - 'modules/gestor/gestor-navigation*'
      - 'scripts/test-nfse-local-stage1.mjs'
      - 'scripts/test-nfse-certificate-ui.mjs'
      - 'supabase/migrations/*nfse*'
      - 'supabase/tests/nfse*'
      - 'supabase/functions/_shared/nfse-national/**'
      - 'supabase/functions/nfse-certificate-upload/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfse-contracts:
    name: Acesso restrito e contratos NFS-e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
          cache: npm
      - run: node scripts/check-node-security.mjs
      - run: npm ci
      - run: node scripts/test-nfse-local-stage1.mjs
      - name: Validar senha, mensagens e validade do certificado A1
        run: >-
          node --test
          modules/gestor/configuracoes/nfse-portal-contribuinte/components/*.test.ts
          modules/gestor/emissor-nfse/services/configuration/certificate-upload.errors.test.ts
      - name: Preparar DOM isolado para cadastro A1
        run: npm install --prefix "$RUNNER_TEMP/nfse-certificate-ui" --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
      - name: Exercitar cadastro A1 com transporte simulado
        env:
          NFSE_CERTIFICATE_JSDOM_PATH: ${{ runner.temp }}/nfse-certificate-ui/node_modules/jsdom
        run: node scripts/test-nfse-certificate-ui.mjs
      - name: Exercitar seleção e exclusão lógica da fila com dados sintéticos
        env:
          NFSE_TEST_JSDOM_MODULE: ${{ runner.temp }}/nfse-certificate-ui/node_modules/jsdom/lib/api.js
        run: node --test modules/gestor/emissor-nfse/pendentes/PendentesNfseTab.interaction.test.mjs
      - run: node --test scripts/check-file-line-limits.test.mjs
      - run: node --test modules/gestor/emissor-nfse/visualizador/danfse.pdf.test.mjs
      - name: Instalar PostgreSQL isolado para os contratos fiscais
        run: npm install --prefix "$RUNNER_TEMP/nfse-sql" --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Validar recebimentos, modelos e serviços em banco isolado
        env:
          NFSE_TEST_PGLITE_MODULE: ${{ runner.temp }}/nfse-sql/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test supabase/tests/nfse*.isolated.test.mjs

  nfse-provider-offline:
    name: DPS, assinatura, cancelamento e certificado sem rede fiscal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Instalar validador XSD
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validar DPS, eventos e assinaturas com certificados sintéticos
        run: >-
          deno test --no-config
          --lock=supabase/functions/_shared/nfse-national/deno.lock --frozen
          --allow-read --allow-write=/tmp --allow-run=openssl,xmllint
          supabase/functions/_shared/nfse-national/
      - name: Validar cadastro A1 sem credenciais reais
        run: >-
          deno test --config supabase/functions/nfse-certificate-upload/deno.json
          --frozen --allow-env
          supabase/functions/nfse-certificate-upload/certificate.test.ts
          supabase/functions/nfse-certificate-upload/pkcs12-reader.test.ts
      - name: Conferir tipos da Edge de cadastro
        run: >-
          deno check --config supabase/functions/nfse-certificate-upload/deno.json
          --frozen supabase/functions/nfse-certificate-upload/index.ts

  nfse-certificate-edge-runtime:
    name: Cadastro A1 no runtime Deno 2.1.4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      # Deno 2.1.4 cannot read the Edge's format-5 lockfile. Dependencies in
      # these tests are version-pinned. Type checks and --frozen remain in
      # the current-runtime job; this job exercises the production-era runtime.
      - name: Validar parser e autorização com certificados sintéticos
        run: >-
          deno test --no-config --no-lock --no-check --node-modules-dir=none --allow-env
          supabase/functions/nfse-certificate-upload/certificate.test.ts
          supabase/functions/nfse-certificate-upload/pkcs12-reader.test.ts
