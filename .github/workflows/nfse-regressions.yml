name: Regressões NFS-e

on:
  pull_request:
    paths:
      - '.github/workflows/nfse-regressions.yml'
      - 'modules/gestor/emissor-nfse/**'
      - 'modules/gestor/configuracoes/nfse-portal-contribuinte/**'
      - 'modules/gestor/access-control*'
      - 'modules/gestor/gestor-navigation*'
      - 'scripts/test-nfse-local-stage1.mjs'
      - 'scripts/test-nfse-certificate-ui.mjs'
      - 'supabase/migrations/*nfse*'
      - 'supabase/tests/nfse*'
      - 'supabase/functions/_shared/nfse-national/**'
      - 'supabase/functions/nfse-certificate-upload/**'
      - 'supabase/functions/nfse-national-preflight/**'
      - 'supabase/functions/nfse-national-pilot/**'
      - 'supabase/functions/nfse-national-individual/**'
      - 'supabase/functions/nfse-national-health/**'
      - 'api/nfse-homologation-relay.js'
      - 'api/nfse-production-relay.js'
      - 'internal/integracoes/nfse-relay/**'
      - 'internal/integracoes/nfse-production-relay/**'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nfse-regressions.yml'
      - 'modules/gestor/emissor-nfse/**'
      - 'modules/gestor/configuracoes/nfse-portal-contribuinte/**'
      - 'modules/gestor/access-control*'
      - 'modules/gestor/gestor-navigation*'
      - 'scripts/test-nfse-local-stage1.mjs'
      - 'scripts/test-nfse-certificate-ui.mjs'
      - 'supabase/migrations/*nfse*'
      - 'supabase/tests/nfse*'
      - 'supabase/functions/_shared/nfse-national/**'
      - 'supabase/functions/nfse-certificate-upload/**'
      - 'supabase/functions/nfse-national-preflight/**'
      - 'supabase/functions/nfse-national-pilot/**'
      - 'supabase/functions/nfse-national-individual/**'
      - 'supabase/functions/nfse-national-health/**'
      - 'api/nfse-homologation-relay.js'
      - 'api/nfse-production-relay.js'
      - 'internal/integracoes/nfse-relay/**'
      - 'internal/integracoes/nfse-production-relay/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfse-contracts:
    name: Acesso restrito e contratos NFS-e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
          cache: npm
      - run: node scripts/check-node-security.mjs
      - run: npm ci
      - run: node scripts/test-nfse-local-stage1.mjs
      - name: Validar senha, mensagens e validade do certificado A1
        run: >-
          node --test
          modules/gestor/configuracoes/nfse-portal-contribuinte/components/*.test.ts
          modules/gestor/emissor-nfse/services/configuration/certificate-upload.errors.test.ts
      - name: Preparar DOM isolado para cadastro A1
        run: npm install --prefix "$RUNNER_TEMP/nfse-certificate-ui" --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
      - name: Exercitar cadastro A1 com transporte simulado
        env:
          NFSE_CERTIFICATE_JSDOM_PATH: ${{ runner.temp }}/nfse-certificate-ui/node_modules/jsdom
        run: node scripts/test-nfse-certificate-ui.mjs
      - name: Exercitar seleção e exclusão lógica da fila com dados sintéticos
        env:
          NFSE_TEST_JSDOM_MODULE: ${{ runner.temp }}/nfse-certificate-ui/node_modules/jsdom/lib/api.js
        run: node --test modules/gestor/emissor-nfse/pendentes/PendentesNfseTab.interaction.test.mjs
      - name: Exercitar revisão fiscal da fila sem transmissão
        env:
          NFSE_TEST_JSDOM_MODULE: ${{ runner.temp }}/nfse-certificate-ui/node_modules/jsdom/lib/api.js
        run: node --test modules/gestor/emissor-nfse/fila/fiscal-review/NfseFiscalReviewModal.interaction.test.mjs
      - name: Exercitar cadastro de pré-modelos sem transmissão
        env:
          NFSE_TEST_JSDOM_MODULE: ${{ runner.temp }}/nfse-certificate-ui/node_modules/jsdom/lib/api.js
        run: >-
          node --test
          modules/gestor/emissor-nfse/modelos/NfseModelForm.interaction.test.mjs
          modules/gestor/emissor-nfse/modelos/NfseModelActions.interaction.test.mjs
          modules/gestor/emissor-nfse/modelos/NfseModelValuesFields.interaction.test.mjs
          modules/gestor/emissor-nfse/modelos/NfseModelAdditionalFields.interaction.test.mjs
          modules/gestor/emissor-nfse/modelos/NfseModelLocationPicker.interaction.test.mjs
          modules/gestor/emissor-nfse/modelos/NfseModelDescriptionEditor.interaction.test.mjs
          modules/gestor/emissor-nfse/modelos/exportacao/NfseModelExportModal.interaction.test.mjs
          modules/gestor/emissor-nfse/parceiros/NfsePartnerServiceModal.interaction.test.mjs
      - name: Exercitar emissão, recuperação e consulta de numeração sem transmissão
        env:
          NFSE_TEST_JSDOM_MODULE: ${{ runner.temp }}/nfse-certificate-ui/node_modules/jsdom/lib/api.js
        run: >-
          node --test
          modules/gestor/emissor-nfse/emissao/NfseSourceEmissionModal.interaction.test.mjs
          modules/gestor/emissor-nfse/individual/NfseIndividualCancellation.interaction.test.mjs
          modules/gestor/emissor-nfse/emissao/NfseDailyFlow.interaction.test.mjs
          modules/gestor/emissor-nfse/emissao/NfseBatchEmissionModal.interaction.test.mjs
          modules/gestor/emissor-nfse/emitidas/NfseIssuedList.interaction.test.mjs
          modules/gestor/emissor-nfse/emitidas/NfseIssuedPeriod.interaction.test.mjs
          modules/gestor/emissor-nfse/emitidas/exportacao/NfseIssuedExportModal.interaction.test.mjs
          modules/gestor/emissor-nfse/visualizador/NfseXmlViewerModal.interaction.test.mjs
          modules/gestor/emissor-nfse/parceiros/ServicosParceirosNfseTab.interaction.test.mjs
          modules/gestor/emissor-nfse/preparar/NfseStudentGroups.interaction.test.mjs
          modules/gestor/emissor-nfse/components/NfseEnvironmentStatus.interaction.test.mjs
          modules/gestor/emissor-nfse/erros/ErrosNfseTab.interaction.test.mjs
          modules/gestor/emissor-nfse/hooks/useNfseEnvironment.interaction.test.mjs
          modules/gestor/emissor-nfse/cancelamento/NfseCancellationModels.interaction.test.mjs
          modules/gestor/configuracoes/nfse-portal-contribuinte/components/NfseNumberingPanel.interaction.test.mjs
      - run: node --test modules/gestor/emissor-nfse/health/nfse-health.contract.test.ts
      - run: node --test scripts/check-file-line-limits.test.mjs
      - name: Validar DANFSe e cancelamento na prévia, PDF e ZIP
        run: >-
          node --test
          modules/gestor/emissor-nfse/visualizador/danfse.pdf.test.mjs
          modules/gestor/emissor-nfse/visualizador/services/nfse-cancelled-downloads.test.mjs
      - run: node --test modules/gestor/emissor-nfse/modelos/exportacao/nfse-model-export.test.mjs
      - name: Validar relatório interno de emitidas e snapshot completo
        run: >-
          node --test
          modules/gestor/emissor-nfse/emitidas/exportacao/nfse-issued-export.service.test.mjs
          modules/gestor/emissor-nfse/exportacao/interno/nfse-issued-export.pdf.test.mjs
      - name: Instalar PostgreSQL isolado para os contratos fiscais
        run: npm install --prefix "$RUNNER_TEMP/nfse-sql" --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Validar recebimentos, modelos e serviços em banco isolado
        env:
          NFSE_TEST_PGLITE_MODULE: ${{ runner.temp }}/nfse-sql/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test supabase/tests/nfse*.isolated.test.mjs

  nfse-provider-offline:
    name: DPS, assinatura, cancelamento e certificado sem rede fiscal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Instalar validador XSD
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validar DPS, eventos e assinaturas com certificados sintéticos
        run: >-
          deno test --no-config
          --lock=supabase/functions/_shared/nfse-national/deno.lock --frozen
          --allow-read --allow-write=/tmp --allow-run=openssl,xmllint
          supabase/functions/_shared/nfse-national/provider.test.ts
          supabase/functions/_shared/nfse-national/pilot.test.ts
          supabase/functions/_shared/nfse-national/cancellation-policy.test.ts
          supabase/functions/_shared/nfse-national/homologation-live-contract.test.ts
          supabase/functions/_shared/nfse-national/relay.test.ts
          supabase/functions/_shared/nfse-national/production-relay.test.ts
          supabase/functions/_shared/nfse-national/production-live-contract.test.ts
          supabase/functions/_shared/nfse-national/production-diagnostics.test.ts
          supabase/functions/_shared/nfse-national/production-event-detail.test.ts
          supabase/functions/_shared/nfse-national/production-event-archive.test.ts
          supabase/functions/_shared/nfse-national/production-event-representation.test.ts
          supabase/functions/_shared/nfse-national/production-optional-json-id.test.ts
          supabase/functions/_shared/nfse-national/production.test.ts
      - name: Validar cadastro A1 sem credenciais reais
        run: >-
          deno test --config supabase/functions/nfse-certificate-upload/deno.json
          --frozen --allow-env
          supabase/functions/nfse-certificate-upload/certificate.test.ts
          supabase/functions/nfse-certificate-upload/pkcs12-reader.test.ts
      - name: Conferir tipos da Edge de cadastro
        run: >-
          deno check --config supabase/functions/nfse-certificate-upload/deno.json
          --frozen supabase/functions/nfse-certificate-upload/index.ts
      - name: Validar preflight e executor sem credenciais reais
        run: >-
          deno test --no-config --allow-read
          supabase/functions/nfse-national-preflight/preflight.test.ts
          supabase/functions/nfse-national-preflight/routes.test.ts
          supabase/functions/nfse-national-pilot/handler.test.ts
          supabase/functions/nfse-national-pilot/contract.test.ts
          supabase/functions/nfse-national-pilot/scenario.test.ts
      - name: Conferir tipos do executor de homologação
        run: >-
          deno check --config supabase/functions/nfse-national-pilot/deno.json
          --frozen supabase/functions/nfse-national-pilot/index.ts
      - name: Validar contrato, adapter e runtime da emissão individual de produção sem rede fiscal
        run: >-
          deno test --config supabase/functions/nfse-national-individual/deno.json
          --frozen --allow-read --allow-write=/tmp --allow-run=openssl
          supabase/functions/nfse-national-individual/handler.test.ts
          supabase/functions/nfse-national-individual/adapter.test.ts
          supabase/functions/nfse-national-individual/adapter-ibscbs.test.ts
          supabase/functions/nfse-national-individual/service-location.test.ts
          supabase/functions/nfse-national-individual/cancellation-review.test.ts
          supabase/functions/nfse-national-individual/queue-bridge.test.ts
          supabase/functions/nfse-national-individual/runtime.test.ts
      - name: Conferir tipos do executor individual de produção
        run: >-
          deno check --config supabase/functions/nfse-national-individual/deno.json
          --frozen supabase/functions/nfse-national-individual/index.ts
      - name: Validar consulta de saúde sem rede fiscal
        run: >-
          deno test --no-config supabase/functions/nfse-national-health/health.test.ts
      - name: Conferir tipos da consulta de saúde
        run: >-
          deno check --config supabase/functions/nfse-national-individual/deno.json
          --frozen supabase/functions/nfse-national-health/index.ts
      - name: Validar canal privado Node com credenciais sintéticas
        run: >-
          node --test
          internal/integracoes/nfse-relay/relay.test.mjs
          internal/integracoes/nfse-relay/renegotiation.test.mjs
          internal/integracoes/nfse-production-relay/relay.test.mjs

  nfse-certificate-edge-runtime:
    name: Cadastro A1 no runtime Deno 2.1.4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      # Deno 2.1.4 cannot read the Edge's format-5 lockfile. Dependencies in
      # these tests are version-pinned. Type checks and --frozen remain in
      # the current-runtime job; this job exercises the production-era runtime.
      - name: Validar parser e autorização com certificados sintéticos
        run: >-
          deno test --no-config --no-lock --no-check --node-modules-dir=none --allow-env
          supabase/functions/nfse-certificate-upload/certificate.test.ts
          supabase/functions/nfse-certificate-upload/pkcs12-reader.test.ts




