name: Regressões NFS-e

on:
  pull_request:
    paths:
      - '.github/workflows/nfse-regressions.yml'
      - 'modules/gestor/emissor-nfse/**'
      - 'modules/gestor/configuracoes/nfse-portal-contribuinte/**'
      - 'modules/gestor/access-control*'
      - 'modules/gestor/gestor-navigation*'
      - 'scripts/test-nfse-local-stage1.mjs'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nfse-regressions.yml'
      - 'modules/gestor/emissor-nfse/**'
      - 'modules/gestor/configuracoes/nfse-portal-contribuinte/**'
      - 'modules/gestor/access-control*'
      - 'modules/gestor/gestor-navigation*'
      - 'scripts/test-nfse-local-stage1.mjs'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfse-contracts:
    name: Acesso restrito e contratos NFS-e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
          cache: npm
      - run: node scripts/check-node-security.mjs
      - run: npm ci
      - run: node scripts/test-nfse-local-stage1.mjs
