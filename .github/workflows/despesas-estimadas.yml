name: Despesas estimadas e vencidas

on:
  pull_request:
    paths:
      - 'modules/gestor/financeiro/despesas/**'
      - 'modules/gestor/financeiro/settlements/**'
      - 'supabase/migrations/*estimated_expense*'
      - 'supabase/migrations/*expense_estimate*'
      - 'supabase/migrations/*overdue_expenses*'
      - 'supabase/migrations/*expense_workspace*'
      - 'supabase/tests/estimated_expense.*'
      - 'supabase/tests/expense_workspace.*'
      - '.github/workflows/despesas-estimadas.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependências isoladas para testes fictícios
        run: npm install --prefix "$RUNNER_TEMP/expense-estimates" --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.13 jsdom@26.1.0
      - name: Contratos financeiros e interface real
        env:
          PGLITE_MODULE_PATH: ${{ runner.temp }}/expense-estimates/node_modules/@electric-sql/pglite/dist/index.js
          FINANCIAL_PAYMENT_JSDOM_PATH: ${{ runner.temp }}/expense-estimates/node_modules/jsdom
        run: |
          node supabase/tests/estimated_expense.isolated.test.mjs
          node supabase/tests/expense_workspace.isolated.test.mjs
          node --test --test-force-exit modules/gestor/financeiro/despesas/hooks/despesas-realtime.interaction.test.mjs
          node --test --test-force-exit modules/gestor/financeiro/despesas/despesas-workspace.test.mjs modules/gestor/financeiro/despesas/components/despesas-workspace.interaction.test.mjs modules/gestor/financeiro/despesas/components/despesa-periodo-apresentacao.test.ts
          node --test --test-force-exit modules/gestor/financeiro/despesas/components/despesa-estimada-criacao.interaction.test.mjs modules/gestor/financeiro/despesas/components/despesa-estimated-payment.interaction.test.mjs modules/gestor/financeiro/despesas/components/despesa-sem-cobranca.interaction.test.mjs modules/gestor/financeiro/despesas/despesas-estimativas-leitura.test.mjs modules/gestor/financeiro/despesas/components/despesa-grouping.model.test.ts
