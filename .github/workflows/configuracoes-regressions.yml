name: Regressões de Configurações

on:
  pull_request:
    paths:
      - '.github/workflows/configuracoes-regressions.yml'
      - 'scripts/test-configuracoes-ui.mjs'
      - 'scripts/check-node-security.mjs'
      - 'modules/gestor/configuracoes/**'
      - 'supabase/functions/gateways/api/**'
      - 'supabase/migrations/*dependency_banese_creation_configuration*'
      - 'supabase/migrations/*payment_gateway_configuration_realtime*'
      - 'supabase/tests/payment_gateway_configuration*'
      - 'modules/shared/components/InstitutionalSelect*'
      - 'modules/gestor/access-control*'
      - 'lib/**'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/configuracoes-regressions.yml'
      - 'scripts/test-configuracoes-ui.mjs'
      - 'scripts/check-node-security.mjs'
      - 'modules/gestor/configuracoes/**'
      - 'supabase/functions/gateways/api/**'
      - 'supabase/migrations/*dependency_banese_creation_configuration*'
      - 'supabase/migrations/*payment_gateway_configuration_realtime*'
      - 'supabase/tests/payment_gateway_configuration*'
      - 'modules/shared/components/InstitutionalSelect*'
      - 'modules/gestor/access-control*'
      - 'lib/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configuracoes-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configuracoes-ui:
    name: IDs dos seletores e herança de acesso
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
          cache: npm

      - name: Validar versão segura do Node
        run: node scripts/check-node-security.mjs

      - name: Preparar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Preparar DOM temporário
        run: npm install --prefix "$RUNNER_TEMP/universo-configuracoes-tests" --no-save --package-lock=false --ignore-scripts jsdom@26.1.0 @electric-sql/pglite@0.5.13

      - name: Conferir seletores e limites de acesso
        env:
          CONFIG_JSDOM_PATH: ${{ runner.temp }}/universo-configuracoes-tests/node_modules/jsdom
        run: node scripts/test-configuracoes-ui.mjs

      - name: Conferir controles bancários com dados fictícios
        env:
          NFSE_TEST_JSDOM_MODULE: ${{ runner.temp }}/universo-configuracoes-tests/node_modules/jsdom/lib/api.js
        run: node --test modules/gestor/configuracoes/integracao-bancaria/*.interaction.test.mjs

      - name: Conferir autorização e rotas bancárias sem rede
        run: deno test --deny-net --allow-read --allow-env supabase/functions/gateways/api/config.test.ts supabase/functions/gateways/api/runtime.test.ts supabase/functions/gateways/runtime-config.test.ts supabase/functions/gateways/router.test.ts

      - name: Conferir guardas SQL e Realtime em banco fictício
        env:
          PGLITE_MODULE_PATH: ${{ runner.temp }}/universo-configuracoes-tests/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test supabase/tests/payment_gateway_configuration.isolated.test.mjs
