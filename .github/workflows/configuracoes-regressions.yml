name: Regressões de Configurações

on:
  pull_request:
    paths:
      - '.github/workflows/configuracoes-regressions.yml'
      - 'scripts/test-configuracoes-ui.mjs'
      - 'scripts/check-node-security.mjs'
      - 'modules/gestor/configuracoes/**'
      - 'modules/shared/components/InstitutionalSelect*'
      - 'modules/gestor/access-control*'
      - 'lib/**'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/configuracoes-regressions.yml'
      - 'scripts/test-configuracoes-ui.mjs'
      - 'scripts/check-node-security.mjs'
      - 'modules/gestor/configuracoes/**'
      - 'modules/shared/components/InstitutionalSelect*'
      - 'modules/gestor/access-control*'
      - 'lib/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configuracoes-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configuracoes-ui:
    name: IDs dos seletores e herança de acesso
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
          cache: npm

      - name: Validar versão segura do Node
        run: node scripts/check-node-security.mjs

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Preparar DOM temporário
        run: npm install --prefix "$RUNNER_TEMP/universo-configuracoes-tests" --no-save --package-lock=false --ignore-scripts jsdom@26.1.0

      - name: Conferir seletores e limites de acesso
        env:
          CONFIG_JSDOM_PATH: ${{ runner.temp }}/universo-configuracoes-tests/node_modules/jsdom
        run: node scripts/test-configuracoes-ui.mjs
