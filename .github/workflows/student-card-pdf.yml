name: Carteirinha PDF

on:
  pull_request:
    paths:
      - 'modules/aluno/secretaria/**'
      - 'modules/gestor/secretaria/carteirinhas/**'
      - 'modules/gestor/cadastros/modelos-documentos/carteirinha/**'
      - 'modules/shared/pdf/student-card/**'
      - 'modules/shared/pdf/PdfPagePreview.tsx'
      - '.github/workflows/student-card-pdf.yml'
  push:
    branches: [main]
    paths:
      - 'modules/aluno/secretaria/**'
      - 'modules/gestor/secretaria/carteirinhas/**'
      - 'modules/gestor/cadastros/modelos-documentos/carteirinha/**'
      - 'modules/shared/pdf/student-card/**'
      - 'modules/shared/pdf/PdfPagePreview.tsx'
      - '.github/workflows/student-card-pdf.yml'

jobs:
  student-card-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar dependências do navegador controlado
        run: |
          npm install --prefix "$RUNNER_TEMP/student-card-ui" --no-save --package-lock=false --ignore-scripts react@19.2.7 react-dom@19.2.7 esbuild@0.25.12 playwright@1.58.2 lucide-react@0.564.0 qrcode@1.5.4 tailwindcss@3.4.17 postcss@8.5.6 jspdf@4.2.1 pdf-lib@1.17.1 pdfjs-dist@5.6.205 @napi-rs/canvas@0.1.100
          node "$RUNNER_TEMP/student-card-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Preservar seleção durante emissão e atualização do workspace
        run: EAD_UI_NODE_MODULES="$RUNNER_TEMP/student-card-ui/node_modules" node modules/gestor/secretaria/carteirinhas/secretaria-carteirinhas-workspace.test.mjs
      - name: Conferir modelos, PDF real, prévia, download, impressão e falhas de ativos
        run: STUDENT_CARD_NODE_MODULES="$RUNNER_TEMP/student-card-ui/node_modules" STUDENT_CARD_ARTIFACTS="$RUNNER_TEMP/student-card-artifacts" node modules/gestor/secretaria/carteirinhas/student-card.browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-card-synthetic-pdf
          path: ${{ runner.temp }}/student-card-artifacts
          if-no-files-found: warn
