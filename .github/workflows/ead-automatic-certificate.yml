name: Certificado automático EAD

on:
  pull_request:
    paths:
      - '.github/workflows/ead-automatic-certificate.yml'
      - 'supabase/migrations/**'
      - 'supabase/tests/ead_automatic_certificate*'
      - 'supabase/tests/ead_certificate_curriculum*'
      - 'supabase/tests/ead_certificate_table*'
      - 'supabase/tests/ead_certificate_identity*'
      - 'supabase/tests/fixtures/ead-certificate-test-harness.mjs'
      - 'supabase/tests/fixtures/ead-auto-certificate*'
      - 'supabase/tests/fixtures/ead-certificate-original-issuers.sql'
      - 'modules/gestor/secretaria/certificados/**'
      - 'modules/gestor/secretaria/historico-emissoes/**'
      - 'modules/gestor/secretaria/shared/**'
      - 'modules/shared/utils/**'
      - 'modules/shared/secretaria/**'
      - 'modules/gestor/secretaria/declaracao-matricula/**'
      - 'supabase/tests/declaration_identity*'
      - 'supabase/tests/fixtures/declaration-identity-schema.sql'
      - 'modules/shared/pdf/**'
      - 'modules/aluno/cursos/**'
      - 'modules/gestor/cadastros/modelos-documentos/diploma/**'
      - 'modules/ead/**'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ead-automatic-certificate.yml'
      - 'supabase/migrations/**'
      - 'supabase/tests/ead_automatic_certificate*'
      - 'supabase/tests/ead_certificate_curriculum*'
      - 'supabase/tests/ead_certificate_table*'
      - 'supabase/tests/ead_certificate_identity*'
      - 'supabase/tests/fixtures/ead-certificate-test-harness.mjs'
      - 'supabase/tests/fixtures/ead-auto-certificate*'
      - 'supabase/tests/fixtures/ead-certificate-original-issuers.sql'
      - 'modules/gestor/secretaria/certificados/**'
      - 'modules/gestor/secretaria/historico-emissoes/**'
      - 'modules/gestor/secretaria/shared/**'
      - 'modules/shared/utils/**'
      - 'modules/shared/secretaria/**'
      - 'modules/gestor/secretaria/declaracao-matricula/**'
      - 'supabase/tests/declaration_identity*'
      - 'supabase/tests/fixtures/declaration-identity-schema.sql'
      - 'modules/shared/pdf/**'
      - 'modules/aluno/cursos/**'
      - 'modules/gestor/cadastros/modelos-documentos/diploma/**'
      - 'modules/ead/**'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  ead-automatic-certificate:
    name: Emissão EAD, idempotência e isolamento de modalidades
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preparar PostgreSQL isolado
        run: npm install --prefix "$RUNNER_TEMP/ead-certificate-sql" --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Validar identidade das declarações e autorização do histórico
        run: PGLITE_MODULE_PATH="$RUNNER_TEMP/ead-certificate-sql/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/declaration_identity.isolated.test.mjs
      - name: Validar emissão automática, autorização e replays
        run: PGLITE_MODULE_PATH="$RUNNER_TEMP/ead-certificate-sql/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/ead_automatic_certificate.isolated.test.mjs
      - name: Validar currículo canônico e exportar payload SQL sintético
        run: PGLITE_MODULE_PATH="$RUNNER_TEMP/ead-certificate-sql/node_modules/@electric-sql/pglite/dist/index.js" EAD_CURRICULUM_FIXTURE_OUT="$RUNNER_TEMP/ead-curriculum-payload.json" node supabase/tests/ead_certificate_curriculum.isolated.test.mjs
      - name: Validar tabela canônica e exportar payload SQL para paridade com o editor
        run: PGLITE_MODULE_PATH="$RUNNER_TEMP/ead-certificate-sql/node_modules/@electric-sql/pglite/dist/index.js" EAD_TABLE_FIXTURE_OUT="$RUNNER_TEMP/ead-table-payload.json" node supabase/tests/ead_certificate_table.isolated.test.mjs
      - name: Validar identidade congelada da emissão EAD
        run: PGLITE_MODULE_PATH="$RUNNER_TEMP/ead-certificate-sql/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/ead_certificate_identity.isolated.test.mjs
      - name: Validar prioridade e presença dos campos de identidade
        run: node modules/gestor/secretaria/certificados/certificate-identity-snapshot.test.mjs
      - name: Preparar navegador e dependências isoladas da interface
        run: |
          npm install --prefix "$RUNNER_TEMP/ead-certificate-ui" --no-save --package-lock=false --ignore-scripts react@19.2.7 react-dom@19.2.7 esbuild@0.25.12 playwright@1.56.1 lucide-react@0.564.0 dompurify@3.4.13 qrcode@1.5.4 tailwindcss@3.4.17 postcss@8.5.6 @tanstack/react-query@5.101.0 jspdf@4.2.1 pdf-lib@1.17.1 pdfjs-dist@5.6.205 @napi-rs/canvas@0.1.100
          node "$RUNNER_TEMP/ead-certificate-ui/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Validar identidade e campos opcionais nas três entradas de declaração
        run: EAD_UI_NODE_MODULES="$RUNNER_TEMP/ead-certificate-ui/node_modules" node modules/shared/utils/declaration-identity.integration.test.mjs
      - name: Validar EAD automático, prévia acessível e registro técnico preservado
        run: EAD_UI_NODE_MODULES="$RUNNER_TEMP/ead-certificate-ui/node_modules" node modules/gestor/secretaria/certificados/ead-certificates.ui.test.mjs
      - name: Validar contrato de apresentação EAD
        run: node modules/gestor/secretaria/certificados/components/ead-certificate-curriculum.test.mjs
      - name: Validar substituição literal e isolamento dos modelos EAD
        run: EAD_UI_NODE_MODULES="$RUNNER_TEMP/ead-certificate-ui/node_modules" node modules/gestor/secretaria/certificados/components/ead-certificate-template.test.mjs
      - name: Validar modelos persistidos e seleção EAD sem fallback
        run: EAD_UI_NODE_MODULES="$RUNNER_TEMP/ead-certificate-ui/node_modules" node modules/gestor/secretaria/certificados/ead-certificate-model.test.mjs
      - name: Validar modelo por curso e leitura atualizada no histórico EAD
        run: EAD_UI_NODE_MODULES="$RUNNER_TEMP/ead-certificate-ui/node_modules" node modules/gestor/secretaria/historico-emissoes/ead-emission-template.test.mjs
      - name: Validar formato e rótulos individuais de documentos EAD
        run: EAD_UI_NODE_MODULES="$RUNNER_TEMP/ead-certificate-ui/node_modules" node modules/gestor/secretaria/certificados/components/ead-certificate-identity.test.mjs
      - name: Validar projeções reais de identidade do aluno e histórico
        run: EAD_UI_NODE_MODULES="$RUNNER_TEMP/ead-certificate-ui/node_modules" node modules/gestor/secretaria/certificados/ead-identity.integration.test.mjs
      - name: Validar editor, identidade e PDF real da Secretaria
        run: EAD_UI_NODE_MODULES="$RUNNER_TEMP/ead-certificate-ui/node_modules" EAD_CURRICULUM_FIXTURE_OUT="$RUNNER_TEMP/ead-table-payload.json" EAD_CURRICULUM_ARTIFACTS="$RUNNER_TEMP/ead-curriculum-pdf" node modules/gestor/secretaria/certificados/ead-curriculum.pdf.test.mjs
      - name: Validar segunda via EAD, linha de assinatura e PDF único
        run: EAD_UI_NODE_MODULES="$RUNNER_TEMP/ead-certificate-ui/node_modules" EAD_CURRICULUM_FIXTURE_OUT="$RUNNER_TEMP/ead-table-payload.json" EAD_HISTORY_ARTIFACTS="$RUNNER_TEMP/ead-history-pdf" node modules/gestor/secretaria/historico-emissoes/ead-history-print.ui.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ead-curriculum-synthetic-pdf
          path: |
            ${{ runner.temp }}/ead-curriculum-pdf
            ${{ runner.temp }}/ead-history-pdf
