name: NFS-e PostgreSQL concurrency
on:
  pull_request:
    paths: ['supabase/migrations/*nfse*', 'supabase/tests/nfse*', '.github/workflows/nfse-postgres-concurrency.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: nfse_concurrency
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
      - run: npm install --prefix "$RUNNER_TEMP/nfse-pg" --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - run: node --test supabase/tests/nfse_postgres_concurrency.test.mjs
        env:
          NFSE_PG_MODULE: ${{ runner.temp }}/nfse-pg/node_modules/pg/lib/index.js
          NFSE_TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@localhost:5432/nfse_concurrency
