<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Verificação de segurança</title>
    <style>
      html,
      body,
      #native-turnstile-root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #native-turnstile-root {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 0 8px;
      }

      #native-turnstile-container {
        width: 100%;
        min-height: 68px;
      }

      #native-turnstile-status {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main id="native-turnstile-root" aria-label="Verificação de segurança">
      <div id="native-turnstile-container"></div>
      <p id="native-turnstile-status" role="status" aria-live="polite">
        Preparando verificação de segurança…
      </p>
    </main>
    <script type="module" src="/native-turnstile.ts"></script>
  </body>
</html>
